map $http_x_forwarded_proto $sicrec_forwarded_proto {
    default $http_x_forwarded_proto;
    ""      $scheme;
}

server {
    listen 80;
    server_name _;
    resolver 127.0.0.11 valid=10s ipv6=off;
    set $backend_upstream http://backend:8080;

    root /usr/share/nginx/html;
    index index.html;
    client_max_body_size 30m;

    location /api/ {
        proxy_pass $backend_upstream;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $sicrec_forwarded_proto;
        proxy_set_header X-Forwarded-Host $host;
        proxy_connect_timeout 30s;
        proxy_read_timeout 180s;
        proxy_send_timeout 180s;
        proxy_intercept_errors on;
        error_page 502 503 504 = @backend_unavailable;
    }

    location @backend_unavailable {
        default_type application/json;
        add_header Cache-Control "no-store" always;
        return 503 '{"message":"El servicio está temporalmente no disponible. Intente nuevamente en unos momentos."}';
    }

    location / {
        try_files $uri $uri/ /index.html;
    }
}
