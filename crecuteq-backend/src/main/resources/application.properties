spring.application.name=crecuteq

# ==========================
# POSTGRESQL
# ==========================

spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:5432/sicrec_db}
spring.datasource.username=${DB_USERNAME}
spring.datasource.password=${DB_PASSWORD}

# ==========================
# JPA / HIBERNATE
# ==========================

spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.open-in-view=false

# Hibernate crea/actualiza primero las tablas de las entidades; luego se
# aplican las migraciones idempotentes de schema.sql que dependen de ellas.
spring.jpa.defer-datasource-initialization=true

# Ejecuta migraciones SQL idempotentes para estructuras existentes
spring.sql.init.mode=always

# ==========================
# SERVER
# ==========================

server.port=${SERVER_PORT:8080}
server.forward-headers-strategy=framework

# URL publica del frontend usada en los correos de recuperacion.
app.public-base-url=${PUBLIC_BASE_URL:http://localhost}

scopus.api.key=${SCOPUS_API_KEY}
# API de búsqueda de artículos
scopus.base.url=https://api.elsevier.com/content/search/scopus

# API de información de revistas
scopus.serial.url=https://api.elsevier.com/content/serial/title

# ==========================
# CORREO ELECTRÓNICO
# ==========================

spring.mail.host=${MAIL_HOST:smtp.gmail.com}
spring.mail.port=${MAIL_PORT:587}
spring.mail.username=${MAIL_USERNAME}
spring.mail.password=${MAIL_PASSWORD}

spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true
spring.mail.default-encoding=UTF-8

# Secreto de firma de los JWT (mínimo 32 caracteres para HS256)
jwt.secret=${JWT_SECRET}

# ==========================
# DESCARGA AUTOMÁTICA SPRINGER
# ==========================

springer.download.enabled=true
springer.download.url=https://cms-resources.apps.public.k8s.springernature.io/springer-cms/rest/v1/content/52799420/data/v5
springer.download.connect-timeout-ms=10000
springer.download.read-timeout-ms=30000
springer.download.cron=0 0 1 1 * *
springer.download.hash-file=data/springer-catalog.sha256

# ==========================
# DESCARGA AUTOMÁTICA DOAJ
# ==========================

doaj.download.enabled=true
doaj.download.url=https://doaj.org/csv
doaj.download.connect-timeout-ms=10000
doaj.download.read-timeout-ms=120000
doaj.download.cron=0 15 1 1 * *
doaj.download.hash-file=data/doaj-catalog.sha256

# El CSV oficial de DOAJ supera el límite multipart predeterminado.
spring.servlet.multipart.max-file-size=30MB
spring.servlet.multipart.max-request-size=30MB

# ==========================
# SOURCE TITLE LIST SCOPUS
# ==========================

scopus.catalog.enabled=true
# Página oficial estable; el enlace mensual al XLSX se descubre automáticamente.
scopus.catalog.url=https://www.elsevier.com/en-gb/products/scopus/content
scopus.catalog.connect-timeout-ms=10000
scopus.catalog.read-timeout-ms=120000
scopus.catalog.cron=0 0 3 1 * *
scopus.catalog.hash-file=data/scopus-source-list.sha256

# Catálogo SCImago: actualización mensual para enriquecer país y cuartil de Scopus.
scimago.download.enabled=true
scimago.download.url=https://www.scimagojr.com/journalrank.php?out=xls
scimago.download.connect-timeout-ms=10000
scimago.download.read-timeout-ms=180000
scimago.download.cron=0 45 1 1 * *
scimago.download.hash-file=data/scimago-catalog.sha256

# ==========================
# DESCARGA AUTOMÁTICA PDF APC SPRINGER
# ==========================

springer.pdf-download.enabled=true
springer.pdf-download.fully-oa.url=https://cms-resources.apps.public.k8s.springernature.io/springer-cms/rest/v1/content/27820860/data/v3
springer.pdf-download.hybrid.url=https://cms-resources.apps.public.k8s.springernature.io/springer-cms/rest/v1/content/27820862/data/v3
springer.pdf-download.connect-timeout-ms=10000
springer.pdf-download.read-timeout-ms=30000
springer.pdf-download.cron=0 30 2 1 * *
springer.pdf-download.fully-oa.hash-file=data/springer-fully-oa.sha256
springer.pdf-download.hybrid.hash-file=data/springer-hybrid.sha256

# LISTA OFICIAL APC ELSEVIER
# Pagina fuente: https://www.elsevier.com/about/policies-and-standards/pricing
elsevier.pricing.enabled=true
elsevier.pricing.source-url=https://www.elsevier.com/about/policies-and-standards/pricing
elsevier.pricing.download-url=https://assets.ctfassets.net/o78em1y1w4i4/5ZH2ckERsr69JYpnMue94T/e8e12b9405bbf6d5df37d2ca8be4845f/article-publishing-charge.xlsx
elsevier.pricing.connect-timeout-ms=10000
elsevier.pricing.read-timeout-ms=120000
elsevier.pricing.cron=0 0 2 1 * *
elsevier.pricing.hash-file=data/elsevier-apc.sha256

# ==========================
# LISTAS OFICIALES APC WILEY
# Pagina fuente: https://authors.wiley.com/author-resources/Journal-Authors/open-access/article-publication-charges/index.html
# ==========================
wiley.pricing.enabled=true
wiley.pricing.open-access-url=https://authors.wiley.com/asset/Wiley-Journal-APCs-Open-Access.xlsx
wiley.pricing.hybrid-url=https://authors.wiley.com/asset/Wiley-Journal-APCs-OnlineOpen.xlsx
wiley.pricing.connect-timeout-ms=10000
wiley.pricing.read-timeout-ms=120000
wiley.pricing.cron=0 15 2 1 * *
wiley.pricing.open-access-hash-file=data/wiley-open-access.sha256
wiley.pricing.hybrid-hash-file=data/wiley-hybrid.sha256

# ==========================
# LISTAS OFICIALES APC SAGE
# ==========================
sage.pricing.enabled=true
sage.pricing.source-url=https://www.sagepub.com/journals/information-for-authors/publishing-options
sage.pricing.gold-url=https://www.sagepub.com/docs/default-source/rp-pages/info-for-authors/sage-gold-oa-apcs-2026.xlsx?sfvrsn=5f7181ea_4
sage.pricing.choice-url=https://www.sagepub.com/docs/default-source/rp-pages/info-for-authors/hybrid-oa-sage-choice/sage-choice-price-list-2026---external.xlsx?sfvrsn=4e6e819b_5
sage.pricing.connect-timeout-ms=10000
sage.pricing.read-timeout-ms=120000
sage.pricing.cron=0 30 2 1 * *
sage.pricing.gold-hash-file=data/sage-gold.sha256
sage.pricing.choice-hash-file=data/sage-choice.sha256

# ==========================
# LISTA OFICIAL APC CAMBRIDGE UNIVERSITY PRESS
# Fuente: https://www.cambridge.org/core/services/open-research-policies/gold-open-access-journals
# Sin scraping: descarga directa del XLSX oficial.
# ==========================
cambridge.pricing.enabled=true
cambridge.pricing.url=https://assets.ctfassets.net/ulsp6w1o06p0/11fyBI7OY0AfL2Eo5YbH99/00448e27a249c9f2f3dc9f5a81e4908d/CUPA_APC_Pricelist_2026_July.xlsx
cambridge.pricing.connect-timeout-ms=10000
cambridge.pricing.read-timeout-ms=120000
cambridge.pricing.cron=0 45 2 1 * *
cambridge.pricing.hash-file=data/cambridge-apc.sha256

# ==========================
# LISTAS OFICIALES APC IEEE
# Sin scraping: descarga directa de los dos PDF oficiales y unión por acrónimo/título.
# ==========================
ieee.pricing.enabled=true
ieee.pricing.apc-url=https://journals.ieeeauthorcenter.ieee.org/wp-content/uploads/sites/7/IEEE-Article-Processing-Charges-List.pdf
ieee.pricing.titles-url=https://open.ieee.org/wp-content/uploads/IEEE-Title-List-January-2026.pdf
ieee.pricing.source-url=https://open.ieee.org/for-authors/article-processing-charges/
ieee.pricing.connect-timeout-ms=10000
ieee.pricing.read-timeout-ms=120000
ieee.pricing.cron=0 0 3 1 * *
ieee.pricing.hash-file=data/ieee-apc.sha256

# ==========================
# LISTA OFICIAL APC WALTER DE GRUYTER
# Descarga directa del XLSX oficial 2026; proveedor independiente de Brill.
# ==========================
degruyter.pricing.enabled=true
degruyter.pricing.source-url=https://www.degruyterbrill.com/publishing/for-librarians/ejournals?lang=en
degruyter.pricing.url=https://degruyter-live-craftcms-assets.s3.amazonaws.com/DGB_25/Documents/Journal-Price-Lists/Journal-Price-Lists-20.02.2026/DeGruyter_Journal_Price_List_2026__EUR__2026-02-20.xlsx
degruyter.pricing.connect-timeout-ms=10000
degruyter.pricing.read-timeout-ms=120000
degruyter.pricing.cron=0 15 3 1 * *
degruyter.pricing.hash-file=data/degruyter-apc.sha256

# Lista Brill 2026 publicada por EIFL (descarga XLSX directa, sin scraping)
brill.pricing.enabled=true
brill.pricing.source-url=https://www.eifl.net/apcs/brill-apcs-open-access-publishing
brill.pricing.url=https://docs.google.com/spreadsheets/d/1yd1xlkv70ij7aTrpWdtqVoyLM7tML7H-2pFGNM5nosg/export?format=xlsx&gid=0
brill.pricing.connect-timeout-ms=10000
